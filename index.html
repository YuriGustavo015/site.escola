<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b3d91">
    <title>E.E. Presidente Arthur Bernardes da Silva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo" id="inicio">
        <div class="container navegacao">
            <a href="#inicio" class="logo">
                <span class="simbolo">E</span>
                <span>
                    <strong>E.E. Presidente Arthur Bernardes da Silva</strong>
                    <small>EDUCAÇÃO • CONHECIMENTO • FUTURO</small>
                </span>
            </a>

            <input type="checkbox" id="alternar-menu">
            <label for="alternar-menu" class="menu-botao">&#9776;</label>

            <nav class="menu">
                <a href="#inicio">Início</a>
                <a href="#sobre">Sobre</a>
                <a href="#galeria">Galeria</a>
                <a href="#projeto">Projeto</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="galeria secao" id="galeria">
            <div class="container">
                <div class="titulo">
                    <span class="etiqueta">REGISTROS DA NOSSA ESCOLA</span>
                    <h2>Nossa escola em <span>imagens.</span></h2>
                    <p>Confira alguns espaços que fazem parte da nossa história.</p>
                </div>

                <div class="fotos">
                    <figure class="foto foto-grande">
                        <img src="imagens/fachada.jpeg" alt="Fachada da escola" loading="lazy">
                        <figcaption>01 — Fachada da escola</figcaption>
                    </figure>

                    <figure class="foto">
                        <img src="imagens/patio.jpeg" alt="Pátio interno" loading="lazy">
                        <figcaption>02 — Pátio interno</figcaption>
                    </figure>

                    <figure class="foto">
                        <img src="imagens/ambiente.jpeg" alt="Ambiente com mesas e computadores" loading="lazy">
                        <figcaption>03 — Ambiente interno</figcaption>
                    </figure>

                    <figure class="foto foto-larga">
                        <img src="imagens/area-verde.jpeg" alt="Área verde e quadra da escola" loading="lazy">
                        <figcaption>04 — Área verde e esportes</figcaption>
                    </figure>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
